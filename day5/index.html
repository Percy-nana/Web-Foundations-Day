<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory</title>
  <link rel="stylesheet" href="style.css">
  <script src="users.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>User Directory</h1>
    <p class="subtitle">Load the team. Find anyone fast.</p>

    <div class="panel">
      <section class="card">
        <h2>Get the directory</h2>
        <button id="load-users" type="button">Load users</button>
      </section>

      <section class="card">
        <h2>Your users</h2>

        <label for="filter-input">Filter by name</label>
        <input id="filter-input" type="text" placeholder="Filter by name...">

        <p id="status" role="status"></p>

        <ul id="users-list"></ul>
      </section>
    </div>
  </main>
</body>
</html>
